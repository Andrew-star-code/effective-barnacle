# Dev-стек: хранилища, свои сервисы и WeKnora (UI — http://localhost:8080).
# Keycloak, mock-AD, embed/rerank на CPU и тестовая MS SQL добавляются на этапах 0–1 (docs/status.md).
name: ai-assistant-dev

services:
  postgres:
    # Тот же образ, что в docker-compose.yml WeKnora: pgvector + pg_search (BM25).
    image: paradedb/paradedb:v0.25.11-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-password}
      POSTGRES_DB: ${POSTGRES_DB:-weknora}
      PARADEDB_TELEMETRY: "false"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # Только по TCP: при первой инициализации Postgres временно поднимается на unix-сокете
      # и перезапускается; проверка через сокет называла его готовым раньше времени.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.0-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  fake-llm:
    build: ../../services/fake-llm
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  corp-ext-migrate:
    build: ../../services/corp-ext
    command: ["alembic", "upgrade", "head"]
    environment: &corp-ext-env
      CORP_EXT_CONFIG: /etc/corp-ext/corp-ext.yaml
      CORP_EXT_DATABASE__DSN: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev-only-password}@postgres:5432/${POSTGRES_DB:-weknora}
      CORP_EXT_REDIS__URL: redis://redis:6379/5
    volumes: &corp-ext-config
      - ../../config/corp-ext.example.yaml:/etc/corp-ext/corp-ext.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  corp-ext:
    build: ../../services/corp-ext
    environment: *corp-ext-env
    volumes: *corp-ext-config
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      corp-ext-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  rerank:
    # Реранкер на CPU (SPEC §18.1). В проде — vLLM с /rerank в формате Cohere (§3.3), здесь — TEI:
    # WeKnora понимает его штатным провайдером huggingface_tei. Веса (~2,3 ГБ) скачиваются
    # с Hugging Face при первом запуске и остаются в томе rerank-models.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.2
    command: ["--model-id", "BAAI/bge-reranker-v2-m3", "--port", "8000", "--max-client-batch-size", "64"]
    volumes:
      - rerank-models:/data
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      # Первый запуск качает model.safetensors (~2,3 ГБ): на медленном канале это больше часа.
      start_period: 90m

  # --- Вход: mock-AD + Keycloak (SPEC §6, §18.1) ------------------------------
  mock-ad:
    build: ../mock-ad
    hostname: dc1
    # Samba AD DC пишет служебные xattr (security.*) в sysvol — без SYS_ADMIN provision падает.
    cap_add: [SYS_ADMIN]
    environment:
      MOCK_AD_ADMIN_PASSWORD: ${MOCK_AD_ADMIN_PASSWORD:-Dev-only-Admin1}
      MOCK_AD_USER_PASSWORD: ${MOCK_AD_USER_PASSWORD:-dev-only-Passw0rd}
      MOCK_AD_BIND_PASSWORD: ${MOCK_AD_BIND_PASSWORD:-dev-only-Bind1}
    volumes:
      - mock-ad-state:/var/lib/samba
      - mock-ad-conf:/etc/samba
    ports:
      - "127.0.0.1:3389:389"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/389' && test -f /var/lib/samba/.seeded"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-dev-only-admin}
      # Браузер ходит на keycloak.localhost:8180 (*.localhost резолвится в 127.0.0.1 самим браузером),
      # WeKnora — на keycloak:8080; issuer в токенах один — фронтовый адрес.
      KC_HOSTNAME: http://keycloak.localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Подставляются в realm-corp.dev.json при импорте.
      KC_WEKNORA_CLIENT_SECRET: ${KC_WEKNORA_CLIENT_SECRET:-dev-only-weknora-secret}
      KC_LDAP_BIND_PASSWORD: ${MOCK_AD_BIND_PASSWORD:-dev-only-Bind1}
    volumes:
      # Состояние (встроенная H2) живёт в контейнере: при пересоздании realm заново импортируется из файла,
      # пользователи заново подтягиваются из mock-AD. История событий входа при этом теряется — для dev это нормально.
      - ../../config/keycloak/realm-corp.dev.json:/opt/keycloak/data/import/realm-corp.json:ro
    ports:
      - "127.0.0.1:8180:8080"
    depends_on:
      mock-ad:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # --- WeKnora ---------------------------------------------------------------
  # Пока форка нет, берутся официальные образы закреплённого тега (пилот «как есть», SPEC §21 этап 0).
  # После `make weknora-build` образы из форка подставляются через WEKNORA_IMAGE_PREFIX/WEKNORA_VERSION.
  weknora-docreader:
    image: ${WEKNORA_IMAGE_PREFIX:-wechatopenai}/weknora-docreader:${WEKNORA_VERSION:-v0.9.0}
    environment:
      TZ: UTC
      DOCREADER_IMAGE_OUTPUT_DIR: /tmp/docreader
      SSRF_DNS_WHITELIST_ONLY: "true"
    volumes:
      - docreader-tmp:/tmp/docreader
    healthcheck:
      # В образе нет grpc_health_probe; достаточно, что порт gRPC слушается.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 50051), 2)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  weknora-app:
    image: ${WEKNORA_IMAGE_PREFIX:-wechatopenai}/weknora-app:${WEKNORA_VERSION:-v0.9.0}
    environment:
      TZ: UTC
      GIN_MODE: release
      LOG_LEVEL: info
      # Без него генерации на китайском (SPEC §13.2).
      WEKNORA_LANGUAGE: ru-RU
      AUTO_MIGRATE: "true"
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-password}
      DB_NAME: ${POSTGRES_DB:-weknora}
      RETRIEVE_DRIVER: postgres
      REDIS_ADDR: redis:6379
      REDIS_DB: "0"
      DOCREADER_ADDR: weknora-docreader:50051
      DOCREADER_TRANSPORT: grpc
      STORAGE_TYPE: local
      LOCAL_STORAGE_BASE_DIR: /data/files
      # Секреты только для dev; без явного JWT_SECRET сессии слетают при перезапуске (AGENTS.md §7).
      JWT_SECRET: ${WEKNORA_JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789}
      SYSTEM_AES_KEY: ${WEKNORA_SYSTEM_AES_KEY:-dev-only-aes-key-32-bytes-long!!}
      # Регистрация в dev оставлена для тестовой учётки (WEKNORA_DEV_* в .env.example);
      # в проде вход только через Keycloak (SPEC §6.2).
      DISABLE_REGISTRATION: "false"
      # Вход через Keycloak + mock-AD. Адрес авторизации — для браузера, остальные — изнутри сети.
      OIDC_AUTH_ENABLE: "true"
      # Подставляется в «Войти через {name}» — отсюда винительный падеж.
      OIDC_AUTH_PROVIDER_DISPLAY_NAME: корпоративную учётную запись
      OIDC_AUTH_ISSUER_URL: http://keycloak.localhost:8180/realms/corp
      OIDC_AUTH_AUTHORIZATION_ENDPOINT: http://keycloak.localhost:8180/realms/corp/protocol/openid-connect/auth
      OIDC_AUTH_TOKEN_ENDPOINT: http://keycloak:8080/realms/corp/protocol/openid-connect/token
      OIDC_AUTH_USER_INFO_ENDPOINT: http://keycloak:8080/realms/corp/protocol/openid-connect/userinfo
      OIDC_AUTH_JWKS_URI: http://keycloak:8080/realms/corp/protocol/openid-connect/certs
      OIDC_AUTH_CLIENT_ID: weknora
      OIDC_AUTH_CLIENT_SECRET: ${KC_WEKNORA_CLIENT_SECRET:-dev-only-weknora-secret}
      OIDC_AUTH_SCOPES: openid email profile
      OIDC_USER_INFO_MAPPING_USER_NAME: preferred_username
      OIDC_USER_INFO_MAPPING_EMAIL: email
      # Исходящие запросы — только к своим сервисам (SPEC §17.2); проверяется на пилоте (пункт 16).
      SSRF_DNS_WHITELIST_ONLY: "true"
      # host.docker.internal — только для профиля Ollama (builtin_models.ollama.yaml), в проде его нет.
      # keycloak.localhost — адрес Keycloak для браузера: сервер его только проверяет, но не вызывает.
      SSRF_WHITELIST: fake-llm,rerank,corp-ext,weknora-docreader,keycloak,keycloak.localhost,host.docker.internal
      SSRF_WHITELIST_EXTRA: ""
      OLLAMA_OPTIONAL: "true"
      LANGFUSE_ENABLED: "false"
      WEKNORA_SANDBOX_DOCKER_ENABLED: "false"
    volumes:
      - weknora-files:/data/files
      - docreader-tmp:/tmp/docreader:ro
      # Профиль моделей: fake-llm по умолчанию; WEKNORA_MODELS_FILE=builtin_models.ollama.yaml — Ollama на хосте.
      - ../../config/weknora/${WEKNORA_MODELS_FILE:-builtin_models.dev.yaml}:/app/config/builtin_models.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weknora-docreader:
        condition: service_healthy
      fake-llm:
        condition: service_healthy
      # WeKnora стартует без реранкера; при первом запуске rerank качает веса долго.
      rerank:
        condition: service_started
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  weknora-frontend:
    image: ${WEKNORA_IMAGE_PREFIX:-wechatopenai}/weknora-ui:${WEKNORA_VERSION:-v0.9.0}
    environment:
      DEFAULT_LOCALE: ru-RU
      APP_HOST: weknora-app
      APP_PORT: "8080"
      APP_SCHEME: http
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      weknora-app:
        condition: service_healthy

volumes:
  pgdata:
  weknora-files:
  docreader-tmp:
  rerank-models:
  mock-ad-state:
  mock-ad-conf:
